<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Cairo';src:url('fonts/Cairo.ttf') format('truetype');font-weight:100 1000;font-style:normal;font-display:block}
@font-face{font-family:'Tajawal';src:url('fonts/Tajawal-Regular.ttf') format('truetype');font-weight:400;font-display:block}
@font-face{font-family:'Tajawal';src:url('fonts/Tajawal-Bold.ttf') format('truetype');font-weight:700;font-display:block}
@font-face{font-family:'Tajawal';src:url('fonts/Tajawal-Black.ttf') format('truetype');font-weight:900;font-display:block}
</style>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="cv" width="1080" height="1920"></canvas>
<img id="LOGO" src="logo.png"><img id="VF"><img id="PRS">
<script>
const C=document.getElementById('cv'),X=C.getContext('2d');
const LOGO=document.getElementById('LOGO'), VF=document.getElementById('VF');
const W=1080,H=1920;
/* ── الألوان والخط تجي من theme.json — لا تكتب لوناً ثابتاً هني ── */
let BG='#F3EFEA',INK='#1F1F1D',ACC='#D97757',CLAY='#BD5D3A',MUT='#8A847A',FONT='Cairo',HANDLE='@handle';
let FACE_ANCH=0.30;   /* أين يقع وجه المتحدث داخل كرت الفيديو: 0 = فوق · 1 = تحت (theme.json ← faceAnchor) */
let CAPS=[],VEND=0,OUTRO=0,DUR=0;
function init(d){
  CAPS=d.cards;VEND=d.total;OUTRO=d.outro;DUR=VEND+OUTRO;
  BEHIND=d.behind||null;
  const t=d.theme||{};
  BG=t.bg||BG; INK=t.ink||INK; ACC=t.acc||ACC; CLAY=t.clay||CLAY; MUT=t.mut||MUT;
  FONT=t.font||FONT; if(typeof t.handle==='string') HANDLE=t.handle;
  if(typeof t.faceAnchor==='number') FACE_ANCH=t.faceAnchor;
  if(t.logo){const L=document.getElementById('LOGO'); if(L.getAttribute('src')!==t.logo) L.src=t.logo;}
  /* الخطوط محليّة — لا شبكة وقت الرسم */
}
/* ---------- utils ---------- */
/* ألوان مشتقّة من الثيم — لا تكتب rgba ثابتة */
function hx(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgba(hex,a){const c=hx(hex);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function lum(hex){const c=hx(hex).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];}
const cBG=a=>rgba(BG,a), cINK=a=>rgba(INK,a);
const onACC=()=>lum(ACC)>0.45?INK:'#FFFFFF';
const DARK=()=>lum(BG)<0.4;

const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=t=>1-Math.pow(1-t,3);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const back=t=>{const c=1.9,s=c+1;return 1+s*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const pr=(t,a,b)=>cl((t-a)/(b-a),0,1);
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
function sh(b,y,a){X.shadowColor=cINK(a);X.shadowBlur=b;X.shadowOffsetY=y;}
function nsh(){X.shadowColor='transparent';X.shadowBlur=0;X.shadowOffsetY=0;}
function card(x,y,w,h,r,al){X.save();X.globalAlpha*=(al===undefined?1:al);sh(44,18,0.20);X.fillStyle=cBG(0.97);rr(x,y,w,h,r);X.fill();nsh();X.strokeStyle=cINK(0.09);X.lineWidth=2.5;rr(x,y,w,h,r);X.stroke();X.restore();}
function T(s,x,y,f,c,al,dir){X.save();X.font=f;X.fillStyle=c;X.textAlign=al||'center';X.textBaseline='middle';if(dir)X.direction=dir;X.fillText(s,x,y);X.restore();}
/* ---------- video staging ---------- */
const R_FULL={x:0,y:0,w:1080,h:1920,r:0};
const R_STAGE={x:190,y:470,w:700,h:620,r:44};
const R_SIDE={x:120,y:480,w:840,h:560,r:44};
/* الفيديو تحت والشرح فوق — للحظات المعلومات الكثيرة. يدخل حزام انستقرام عن قصد:
   ما فيه نص تحت أصلاً، والمغطّى جزء من الصورة لا من الكلام. راس المتحدث ينقص من فوق. */
const R_LOWER={x:300,y:1290,w:480,h:630,r:38};   /* كرت صغير تحت — يخلي ثلثي الشاشة للرسم والشرح */
const SCENES=[
 {s: 0.00,e: 2.78,m:R_FULL},  {s: 2.78,e: 6.01,m:R_STAGE}, {s: 6.01,e: 8.03,m:R_SIDE},
 {s: 8.03,e:12.74,m:R_LOWER}, {s:12.74,e:17.19,m:R_STAGE}, {s:17.19,e:19.18,m:R_FULL},
 {s:19.18,e:21.86,m:R_STAGE}, {s:21.86,e:25.22,m:R_SIDE},  {s:25.22,e:29.27,m:R_STAGE},
 {s:29.27,e:32.14,m:R_LOWER}, {s:32.14,e:33.22,m:R_STAGE}, {s:33.22,e:41.66,m:R_LOWER},
 {s:41.66,e:43.34,m:R_STAGE}, {s:43.34,e:99,   m:R_LOWER}];
const TR=0.42;
function vrect(t){
  let i=SCENES.findIndex(s=>t>=s.s&&t<s.e); if(i<0)i=SCENES.length-1;
  let a=SCENES[i].m,b=a,k=1;
  if(t<SCENES[i].s+TR&&i>0){a=SCENES[i-1].m;b=SCENES[i].m;k=eio(pr(t,SCENES[i].s,SCENES[i].s+TR));}
  return {x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k),w:lerp(a.w,b.w,k),h:lerp(a.h,b.h,k),r:lerp(a.r,b.r,k)};
}
function drawVideo(t){
  const R=vrect(t), sw=VF.naturalWidth||1080, shh=VF.naturalHeight||1920;
  const sc=Math.max(R.w/sw,R.h/shh), cw=R.w/sc, ch=R.h/sc;
  const sx=(sw-cw)/2, sy=(shh-ch)*FACE_ANCH;
  X.save();
  if(R.r>0.5){sh(70,26,0.26);X.fillStyle='#000';rr(R.x,R.y,R.w,R.h,R.r);X.fill();nsh();}
  rr(R.x,R.y,R.w,R.h,R.r);X.clip();
  X.drawImage(VF,sx,sy,cw,ch,R.x,R.y,R.w,R.h);
  X.restore();
  if(R.r>0.5){X.save();X.strokeStyle=cINK(0.10);X.lineWidth=3;rr(R.x,R.y,R.w,R.h,R.r);X.stroke();X.restore();}
}
/* ---------- icons ---------- */
function iCaption(x,y,s,c){X.save();X.strokeStyle=c;X.lineWidth=s*0.09;X.lineCap='round';
  rr(x-s/2,y-s*0.38,s,s*0.76,s*0.18);X.stroke();
  X.beginPath();X.moveTo(x-s*0.28,y-s*0.06);X.lineTo(x+s*0.28,y-s*0.06);X.moveTo(x-s*0.28,y+s*0.14);X.lineTo(x+s*0.06,y+s*0.14);X.stroke();X.restore();}
function iZoom(x,y,s,c){X.save();X.strokeStyle=c;X.lineWidth=s*0.09;X.lineCap='round';
  X.beginPath();X.arc(x-s*0.06,y-s*0.06,s*0.3,0,7);X.stroke();
  X.beginPath();X.moveTo(x+s*0.16,y+s*0.16);X.lineTo(x+s*0.36,y+s*0.36);X.stroke();
  X.beginPath();X.moveTo(x-s*0.2,y-s*0.06);X.lineTo(x+s*0.08,y-s*0.06);X.moveTo(x-s*0.06,y-s*0.2);X.lineTo(x-s*0.06,y+s*0.08);X.stroke();X.restore();}
function iCut(x,y,s,c){X.save();X.strokeStyle=c;X.lineWidth=s*0.085;X.lineCap='round';
  X.beginPath();X.arc(x-s*0.2,y+s*0.26,s*0.12,0,7);X.arc(x+s*0.2,y+s*0.26,s*0.12,0,7);X.stroke();
  X.beginPath();X.moveTo(x-s*0.24,y+s*0.16);X.lineTo(x+s*0.22,y-s*0.34);X.moveTo(x+s*0.24,y+s*0.16);X.lineTo(x-s*0.22,y-s*0.34);X.stroke();X.restore();}
function iSpark(x,y,s,c){X.save();X.strokeStyle=c;X.lineWidth=s*0.10;X.lineCap='round';
  for(let i=0;i<8;i++){const a=i*Math.PI/4,r0=s*0.10,r1=s*(i%2?0.28:0.40);
    X.beginPath();X.moveTo(x+Math.cos(a)*r0,y+Math.sin(a)*r0);X.lineTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);X.stroke();}
  X.fillStyle=c;X.beginPath();X.arc(x,y,s*0.09,0,7);X.fill();X.restore();}
function iFile(x,y,s,c){X.save();X.strokeStyle=c;X.lineWidth=s*0.085;X.lineJoin='round';
  X.beginPath();X.moveTo(x-s*0.28,y-s*0.4);X.lineTo(x+s*0.1,y-s*0.4);X.lineTo(x+s*0.28,y-s*0.2);X.lineTo(x+s*0.28,y+s*0.4);X.lineTo(x-s*0.28,y+s*0.4);X.closePath();X.stroke();
  X.beginPath();X.moveTo(x+s*0.1,y-s*0.4);X.lineTo(x+s*0.1,y-s*0.2);X.lineTo(x+s*0.28,y-s*0.2);X.stroke();X.restore();}
function iCloud(x,y,s,c){X.save();X.fillStyle=c;
  X.beginPath();X.arc(x-0.23*s,y+0.03*s,0.20*s,0,7);X.fill();
  X.beginPath();X.arc(x+0.02*s,y-0.11*s,0.28*s,0,7);X.fill();
  X.beginPath();X.arc(x+0.27*s,y+0.05*s,0.17*s,0,7);X.fill();
  rr(x-0.43*s,y+0.03*s,0.87*s,0.20*s,0.10*s);X.fill();X.restore();}
function iCheck(x,y,s,c,k){X.save();X.strokeStyle=c;X.lineWidth=s*0.13;X.lineCap='round';X.lineJoin='round';
  const p=[[-0.32,0.02],[-0.08,0.26],[0.34,-0.26]];X.beginPath();X.moveTo(x+p[0][0]*s,y+p[0][1]*s);
  if(k<0.5){const q=k/0.5;X.lineTo(x+lerp(p[0][0],p[1][0],q)*s,y+lerp(p[0][1],p[1][1],q)*s);}
  else{X.lineTo(x+p[1][0]*s,y+p[1][1]*s);const q=(k-0.5)/0.5;X.lineTo(x+lerp(p[1][0],p[2][0],q)*s,y+lerp(p[1][1],p[2][1],q)*s);}
  X.stroke();X.restore();}
/* ---------- persistent chrome ---------- */
function badge(t){
  if(!HANDLE) return;
  let a=pr(t,0.25,0.7); if(t>VEND-0.3)a*=1-pr(t,VEND-0.3,VEND);
  if(a<=0)return; X.save();X.globalAlpha=a;
  X.font='700 30px '+FONT;const s=HANDLE;
  const tw=X.measureText(s).width,lw=42,g=15,p=30,w=lw+g+tw+p*2,h=76,x=540-w/2,y=190;   /* 190 لا 74: أعلى الشاشة يغطيه انستقرام */
  sh(26,10,0.16);X.fillStyle=cBG(0.94);rr(x,y,w,h,h/2);X.fill();nsh();
  X.strokeStyle=cINK(0.08);X.lineWidth=2;rr(x,y,w,h,h/2);X.stroke();
  X.drawImage(LOGO,x+w-p-lw,y+(h-lw)/2,lw,lw);
  X.fillStyle=INK;X.direction='ltr';X.textAlign='right';X.textBaseline='middle';X.fillText(s,x+w-p-lw-g,y+h/2+2);
  X.restore();}
function bar(t){let a=t>VEND-0.3?1-pr(t,VEND-0.3,VEND):1;if(a<=0)return;
  if(cutoutActive(t)||headoutActive(t))return;     /* بوضعي القصّ الشريط يشوّش — نخفيه */
  const _rb=vrect(t), _lowb=_rb.y>1000;            /* بوضع «الفيديو تحت» يرتفع الشريط فوقه */
  X.save();X.globalAlpha=a;const y=_lowb?Math.max(200,_rb.y-46):1492,h=7,mx=60;
  X.fillStyle=cINK(0.13);rr(mx,y,W-mx*2,h,h/2);X.fill();
  X.fillStyle=ACC;rr(mx,y,(W-mx*2)*cl(t/VEND,0,1),h,h/2);X.fill();X.restore();}
/* ---------- captions ---------- */
const FS=55,LH=79,MAXW=730,GAP=16,PADX=44,PADY=30;  /* 730: يخلي الكرت ينتهي قبل عمود أزرار انستقرام */
function layout(ws){X.font='800 '+FS+'px '+FONT;
  const it=ws.map(w=>({...w,w:X.measureText(w.t).width}));const L=[];let c=[],cw=0;
  for(const i of it){const add=c.length?i.w+GAP:i.w;
    if(cw+add>MAXW&&c.length){L.push({items:c,w:cw});c=[i];cw=i.w;}else{c.push(i);cw+=add;}}
  if(c.length)L.push({items:c,w:cw});return L;}
function caption(t){
  /* لا تكرّر: لو الكلام يمرّ ورا الشخص بهاللحظة، كرت الكابشن يختفي */
  if(BEHIND&&PRS_OK&&vrect(t).r<=0.5&&BEHIND.lines.some(l=>t>=l.s&&t<=l.e)) return;
  const c=CAPS.find(c=>t>=c.s&&t<c.e); if(!c)return;
  const lt=t-c.s,rt=c.e-t;let a=1,dy=0,sc=1;
  if(lt<0.2){const k=lt/0.2;a=ease(k);dy=(1-ease(k))*28;sc=0.93+0.07*back(k);}
  if(rt<0.13){const k=rt/0.13;a=k;dy=-(1-k)*10;}
  const L=layout(c.w),bh=L.length*LH+PADY*2,bw=Math.max(...L.map(l=>l.w))+PADX*2;
  const _R=vrect(t), LOW=_R.y>1000;          /* الفيديو تحت → الكابشن فوقه */
  const CUT=(cutoutActive(t)||headoutActive(t))&&PTOP>200;   /* الكابشن فوق راسه بالوضعين */
  const bx=540-bw/2,by=(CUT?PTOP-46:(LOW?_R.y-40:1460))-bh;   /* 1460 عادةً · وفوق كرت الفيديو بوضع «الفيديو تحت» */
  X.save();X.globalAlpha=a;X.translate(540,by+bh/2+dy);X.scale(sc,sc);X.translate(-540,-(by+bh/2));
  sh(48,20,0.30);X.fillStyle=cBG(0.96);rr(bx,by,bw,bh,38);X.fill();nsh();
  X.strokeStyle=cINK(0.09);X.lineWidth=2.5;rr(bx,by,bw,bh,38);X.stroke();
  X.font='800 '+FS+'px '+FONT;X.textAlign='right';X.textBaseline='middle';
  L.forEach((ln,li)=>{let x=540+ln.w/2;const cy=by+PADY+LH*li+LH/2;
    for(const i of ln.items){const act=t>=i.s&&t<i.e,sp=t>=i.s;let lift=0;
      if(act){const k=Math.min(1,(t-i.s)/0.1);lift=-5*Math.sin(k*Math.PI);}
      if(i.hot&&sp){const k=Math.min(1,(t-i.s)/0.16),gw=(i.w+28)*ease(k),gh=FS+21;
        X.fillStyle=ACC;rr(x+14-gw,cy-gh/2+lift,gw,gh,15);X.fill();X.fillStyle=onACC();}
      else X.fillStyle=act?ACC:INK;
      X.fillText(i.t,x,cy+2+lift);x-=i.w+GAP;}});
  X.restore();}
function wordsOf(i){return (CAPS[i]&&CAPS[i].w)||[];}
/* أي مشهد يشير لجملة مو موجودة بهذا الفيديو ما يوقف الرسم — يتخطّى وحده */
function safe(fn,t,name){
  /* كل مشهد داخل save/restore: لو سقط، حالة الرسم ترجع كما كانت — بدونها تتراكم الأخطاء ويسوَدّ الفيديو */
  X.save();
  try{ fn(t); }
  catch(e){
    if(!window.__scErr) window.__scErr={};
    if(!window.__scErr[name]){window.__scErr[name]=1;console.log('⚠️ مشهد متخطّى:',name,'—',e.message);}
  }
  finally{ X.restore(); }
}
window.__helpers={rr,sh,nsh,card,T,pr,ease,eio,back,lerp,cl};

/* ═══ الكلام يمرّ ورا الشخص — كشيدة عربية ═══
   البيانات من behind.json (يبنيه 11_behind_text.js). الحروف تبقى على الجانبين
   والكشيدة وحدها تمرّ ورا الراس. يشتغل بلحظات ملء الشاشة فقط. */
const PRS=document.getElementById('PRS');
let BEHIND=null, PRS_OK=false, PFACE=null;
const _MC=document.createElement('canvas'); _MC.width=W; _MC.height=H;
const _MX=_MC.getContext('2d',{willReadFrequently:true});
const _FC=document.createElement('canvas'); _FC.width=W; _FC.height=H;
const _FX=_FC.getContext('2d',{willReadFrequently:true});
const NO_FWD=new Set([...'اأإآدذرزوؤةءى']), AR=/[ء-ي]/;
function _pts(w){const p=[];for(let i=0;i<w.length-1;i++){if(NO_FWD.has(w[i]))continue;
  if(!AR.test(w[i+1])||w[i+1]==='ء')continue;p.push(i+1);}return p;}
function _span(yc,h){                       /* حدود جسم المتحدث عند هذا السطر */
  const y0=Math.max(0,Math.round(yc-h/2)),hh=Math.min(H-y0,Math.round(h));
  let d;try{d=_MX.getImageData(0,y0,W,hh).data;}catch(e){return null;}
  let L=1e9,R=-1;
  for(let y=0;y<hh;y+=3){const row=y*W*4;
    for(let x=0;x<W;x+=3){if(d[row+x*4+3]>128){if(x<L)L=x;if(x>R)R=x;}}}
  return R<0?null:{L,R};
}
function _bgLum(yc,h){                       /* إضاءة الخلفية خلف السطر (بلا الشخص) */
  const y0=Math.max(0,Math.round(yc-h/2)),hh=Math.min(H-y0,Math.round(h));
  let d,m;try{d=_FX.getImageData(0,y0,W,hh).data;m=_MX.getImageData(0,y0,W,hh).data;}catch(e){return 0.5;}
  let s=0,n=0;
  for(let y=0;y<hh;y+=4){const row=y*W*4;
    for(let x=0;x<W;x+=4){const i=row+x*4;if(m[i+3]>100)continue;
      s+=(0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2])/255;n++;}}
  return n?s/n:0.5;
}
function _layout(word,font,sp,gap){
  X.font=font;
  const p=_pts(word); const k=X.measureText('اـــا').width-X.measureText('اــا').width;
  if(!p.length||k<=0){const w=X.measureText(word).width;return{full:word,x:540+w/2,left:540-w/2};}
  const at=p[p.length-1], pre=word.slice(0,at), suf=word.slice(at);
  const Wp=X.measureText(pre+'ـ').width-k, Ws=X.measureText('ـ'+suf).width-k;
  const need=sp?(sp.R-sp.L)+gap*2:380;
  const n=Math.max(3,Math.min(70,Math.ceil(need/k)));
  const x=sp?Math.min(W-70,sp.R+gap+Wp):540+(Wp+n*k+Ws)/2;
  return {full:pre+'ـ'.repeat(n)+suf, x, left:x-Wp-n*k-Ws};
}
function behindText(t){
  if(!BEHIND||!PRS_OK) return false;
  const R=vrect(t); if(R.r>0.5) return false;              /* ملء الشاشة فقط */
  const L=BEHIND.lines.find(l=>t>=l.s&&t<=l.e); if(!L) return false;
  _MX.clearRect(0,0,W,H); _MX.drawImage(PRS,0,0,W,H);
  _FX.clearRect(0,0,W,H); _FX.drawImage(VF,0,0,W,H);
  const FS0=Math.min(200, Math.round(760/Math.max(1,L.words.length))+120), LH=Math.round(FS0*1.18);
  const blockH=(L.words.length-1)*LH;
  const f=PFACE, headC=f?f.y+f.h*0.45:700, sh=f?f.y+f.h*1.70:1250;
  let top=headC-blockH/2;
  top=Math.min(top, sh-blockH-LH*0.15);
  top=Math.max(230, Math.min(top, 1430-blockH));
  X.save(); X.textAlign='right'; X.textBaseline='middle';
  L.words.forEach((w,i)=>{
    const k=cl((t-w.s)/0.30,0,1); if(k<=0) return;
    const y=top+i*LH, a=ease(k);
    let fs=FS0, lay=null;
    for(let tr=0;tr<5;tr++){

/* ═══ «راسك برّا المستطيل» ═══
   الفيديو داخل كرت، وراس المتحدث يطلع فوق حافة الكرت (مقصوصاً من الخلفية).
   طبقتان بنفس التحويل: الفيديو مقصوص بحدود الكرت · والراس مقصوص بما فوق الكرت.
   البيانات: behind.json ← headouts:[[من,إلى]] */
function headoutActive(t){
  if(!BEHIND||!BEHIND.headouts||!PRS_OK) return false;
  return BEHIND.headouts.some(c=>t>=c[0]&&t<=c[1]);
}
function _personBox(){
  _MX.clearRect(0,0,W,H); _MX.drawImage(PRS,0,0,W,H);
  let x0=W,x1=-1,y0=H,y1=-1;
  try{ const d=_MX.getImageData(0,0,W,H).data;
    for(let y=0;y<H;y+=4){ const row=y*W*4;
      for(let x=0;x<W;x+=4){ if(d[row+x*4+3]>140){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } } }
  }catch(e){ return null; }
  return x1<0?null:{x0,x1,y0,y1};
}
function headOut(t){
  if(!headoutActive(t)) return false;
  const B=_personBox(); if(!B) return false;
  const R=vrect(t);
  const ph=Math.max(1,B.y1-B.y0), cx=(B.x0+B.x1)/2;
  const cover=Math.max(R.w/W,R.h/H);                  /* لا تصغّر تحت ما يملأ الكرت */
  const sc=Math.max(cover,Math.min(2.2,(R.h*1.28)/ph));
  let dx=R.x+R.w/2-cx*sc; const dy=(R.y+R.h+30)-B.y1*sc;  /* قدماه تحت حافة الكرت بقليل */
  dx=Math.min(R.x, Math.max(R.x+R.w-W*sc, dx));      /* اضمن تغطية عرض الكرت */
  X.save();                                          /* 1) الكرت: الخلفية والجسم داخله */
  sh(70,26,0.26); X.fillStyle=cBG(1); rr(R.x,R.y,R.w,R.h,R.r); X.fill(); nsh();
  rr(R.x,R.y,R.w,R.h,R.r); X.clip();
  X.translate(dx,dy); X.scale(sc,sc); X.drawImage(VF,0,0,W,H);
  X.restore();
  X.save();                                          /* 2) الراس فوق حافة الكرت */
  X.beginPath(); X.rect(Math.max(0,R.x-140),0,Math.min(W,R.w+280),Math.max(0,R.y+2)); X.clip();
  X.translate(dx,dy); X.scale(sc,sc); X.drawImage(PRS,0,0,W,H);
  X.restore();
  X.save();                                          /* إطار الكرت فوق الكل ما عدا الراس */
  X.strokeStyle=cINK(0.10); X.lineWidth=3; rr(R.x,R.y,R.w,R.h,R.r); X.stroke(); X.restore();
  PTOP=dy+B.y0*sc;
  return true;
}

/* ═══ «واقف قدام اللوحة» — المتحدث مقصوص بلا كرت ═══
   يُرسم بعد اللوحات: التصميم خلفه وهو قدامه. الحجم والموضع يُحسبان من حدود جسمه
   بكل فريم، فيبقى ثابتاً حتى لو تحرّك. البيانات: behind.json ← cutouts:[[من,إلى]] */
let PTOP=0;   /* أعلى راس المتحدث بعد القصّ — الكابشن يطلع فوقه */
function cutoutActive(t){
  if(!BEHIND||!BEHIND.cutouts||!PRS_OK) return false;

function personStage(t){

  let x0=W,x1=-1,y0=H,y1=-1;
  try{
    const d=_MX.getImageData(0,0,W,H).data;
    for(let y=0;y<H;y+=4){ const row=y*W*4;
      for(let x=0;x<W;x+=4){ if(d[row+x*4+3]>140){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } } }
  }catch(e){ return false; }
  if(x1<0) return false;
  const ph=Math.max(1,y1-y0), pw=Math.max(1,x1-x0);
  const TARGET_H=900, sc=Math.min(2.0, TARGET_H/ph);      /* طوله ~1010 بكسل — يخلي مجالاً للكابشن فوق راسه */
  const cx=(x0+x1)/2;

  X.translate(dx,dy); X.scale(sc,sc);

  X.restore(); nsh();
  return true;
}

/* ================= SCENE GRAPHICS ================= */
/* ═══════════ الطبقة الكونية — خلفية روحانية ثابتة (starfield + سديم + هندسة مقدسة) ═══════════
   كلها مشتقّة من theme.json، ومرسومة بمولّد أرقام مبذور فالنجوم ما ترقص بين الفريمات. */
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const STARS=(()=>{const r=rnd(20260918),a=[];
  for(let i=0;i<260;i++)a.push({x:r()*W,y:r()*H,s:0.7+r()*2.3,p:r()*6.283,v:0.6+r()*1.8,b:0.25+r()*0.75});
  return a;})();
const DUST=(()=>{const r=rnd(77133),a=[];
  for(let i=0;i<46;i++)a.push({x:r()*W,y:r()*H,s:2+r()*4,p:r()*6.283,v:0.25+r()*0.5});
  return a;})();
function nebula(t){
  /* سديمان يتنفّسان ببطء — لونهما من BG وACC فما يخرج عن الهوية */
  const c=[[300,560,560,ACC,0.085],[820,1340,640,MUT,0.10],[540,980,780,CLAY,0.05]];
  X.save();X.globalCompositeOperation='lighter';
  c.forEach((n,i)=>{const br=1+0.06*Math.sin(t*0.42+i*2.1), R=n[2]*br;
    const g=X.createRadialGradient(n[0],n[1],0,n[0],n[1],R);
    g.addColorStop(0,rgba(n[3],n[4]));g.addColorStop(0.55,rgba(n[3],n[4]*0.35));g.addColorStop(1,rgba(n[3],0));
    X.fillStyle=g;X.beginPath();X.arc(n[0],n[1],R,0,6.283);X.fill();});
  X.restore();}
function starfield(t){
  X.save();
  for(const s of STARS){const tw=0.55+0.45*Math.sin(t*s.v+s.p);
    X.fillStyle=rgba(INK,s.b*tw*0.9);X.beginPath();X.arc(s.x,s.y,s.s*(0.85+0.15*tw),0,6.283);X.fill();}
  X.globalCompositeOperation='lighter';
  for(const d of DUST){const tw=0.5+0.5*Math.sin(t*d.v+d.p);
    const g=X.createRadialGradient(d.x,d.y,0,d.x,d.y,d.s*7);
    g.addColorStop(0,rgba(ACC,0.28*tw));g.addColorStop(1,rgba(ACC,0));
    X.fillStyle=g;X.beginPath();X.arc(d.x,d.y,d.s*7,0,6.283);X.fill();}
  X.restore();}
function ringField(t){
  /* حلقات متمركزة تتمدّد ببطء — صدى صورة 3333 المرجعية */
  X.save();X.globalAlpha=0.5;X.lineWidth=1.6;
  for(let i=0;i<7;i++){const ph=(t*0.055+i/7)%1, R=140+ph*310;

function edgeVeil(){

/* ── أدوات هندسة مقدّسة تستخدمها المشاهد ── */
function seedOfLife(cx,cy,R,t,k,col,lw){
  /* زهرة الحياة: مركز + ٦ دوائر. k=0..1 ترسمها دائرة دائرة */
  X.save();X.strokeStyle=col||ACC;X.lineWidth=lw||4;X.lineCap='round';
  const n=7, done=k*n;
  for(let i=0;i<n;i++){
    const f=cl(done-i,0,1); if(f<=0)continue;
    const ang=Math.PI/180*(60*(i-1)-90), x=i?cx+R*Math.cos(ang):cx, y=i?cy+R*Math.sin(ang):cy;
    X.globalAlpha=0.42+0.58*f;
    X.beginPath();X.arc(x,y,R,-Math.PI/2,-Math.PI/2+6.283*ease(f));X.stroke();}
  X.restore();}
function polyStar(cx,cy,R,pts,step,t,k,col,lw){
  /* نجمة متصلة (٩ نقاط/٧ نقاط) — تُرسم ضلعاً بعد ضلع */
  X.save();X.strokeStyle=col||ACC;X.lineWidth=lw||3.5;X.lineJoin='round';X.lineCap='round';
  const seq=[];for(let i=0;i<=pts;i++){const a=-Math.PI/2+6.283*((i*step)%pts)/pts;
    seq.push([cx+R*Math.cos(a),cy+R*Math.sin(a)]);}
  const total=seq.length-1, done=k*total;
  X.beginPath();X.moveTo(seq[0][0],seq[0][1]);
  for(let i=1;i<seq.length;i++){const f=cl(done-(i-1),0,1);if(f<=0)break;
    X.lineTo(lerp(seq[i-1][0],seq[i][0],f),lerp(seq[i-1][1],seq[i][1],f));}
  X.stroke();
  for(let i=0;i<pts;i++){const f=cl(done-i,0,1);if(f<=0)continue;
    X.fillStyle=col||ACC;X.globalAlpha=f;X.beginPath();X.arc(seq[i][0],seq[i][1],6,0,6.283);X.fill();}
  X.restore();}
function auraRings(cx,cy,t,k,n,R0,col){
  /* هالة نابضة — تُستخدم حول الراس أو حول رقم */
  X.save();X.globalCompositeOperation='lighter';
  for(let i=0;i<(n||4);i++){const ph=((t*0.55+i/(n||4))%1), R=R0*(0.55+ph*1.1);
    X.strokeStyle=rgba(col||ACC,0.42*k*(1-ph));X.lineWidth=3*(1-ph*0.6);
    X.beginPath();X.arc(cx,cy,R,0,6.283);X.stroke();}
  X.restore();}
function glowT(s,x,y,f,col,k,blur){
  /* نص متوهّج — قلب الطابع الروحاني: الكلمة تشعّ مثل رقم 3333 */
  X.save();X.font=f;X.textAlign='center';X.textBaseline='middle';
  X.shadowColor=rgba(col,0.85*(k===undefined?1:k));X.shadowBlur=blur||34;
  X.fillStyle=col;X.globalAlpha=(k===undefined?1:k);
  X.fillText(s,x,y);X.fillText(s,x,y);X.shadowBlur=0;
  X.fillStyle='#FFF8E2';X.globalAlpha=(k===undefined?1:k)*0.92;X.fillText(s,x,y);
  X.restore();}
function beam(cx,y0,y1,w0,w1,k,col){
  X.save();X.globalCompositeOperation='lighter';
  const g=X.createLinearGradient(0,y0,0,y1);
  g.addColorStop(0,rgba(col||ACC,0.34*k));g.addColorStop(1,rgba(col||ACC,0));
  X.fillStyle=g;X.beginPath();X.moveTo(cx-w0/2,y0);X.lineTo(cx+w0/2,y0);

function thread(x0,y0,x1,y1,k,col,amp,t,lw){
  /* خيط نور يُنسج من نقطة لنقطة — amp>0 يعطيه تجديلة تهدأ لما يشتدّ */
